name: build-readme

on:
  push:
    branches: [master]
    paths:
      - "data/videos.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate READMEs
        run: python scripts/build_readme.py
      - name: Commit if changed
        run: |
          git config user.name "ClawShelf"
          git config user.email "support@clawshelf.com"
          git add README.md README.zh-CN.md
          git diff --cached --quiet || git commit -m "Update README"
          git push
